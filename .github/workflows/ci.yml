name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        if: hashFiles('tests/**/*.py') != ''
        run: pytest -q

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      DBT_TARGET: duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      # Skips the steps below until the dbt project lands; remove afterwards.
      - name: Check for dbt project
        id: guard
        working-directory: .
        run: echo "has_dbt=${{ hashFiles('dbt/dbt_project.yml') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.has_dbt == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dbt
        if: steps.guard.outputs.has_dbt == 'true'
        run: pip install dbt-duckdb

      - name: dbt deps
        if: steps.guard.outputs.has_dbt == 'true'
        run: dbt deps

      - name: dbt build (seeds, models, tests on synthetic data)
        if: steps.guard.outputs.has_dbt == 'true'
        run: dbt build

      - name: Lint SQL
        if: steps.guard.outputs.has_dbt == 'true'
        run: |
          pip install sqlfluff
          sqlfluff lint models --config ../.sqlfluff
