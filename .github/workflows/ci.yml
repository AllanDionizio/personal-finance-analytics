name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        run: pytest -q

  dbt-build:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate synthetic workbooks and load raw.*
        run: make data

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (seeds, models, unit and data tests)
        working-directory: dbt
        run: dbt build

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness

      - name: Lint SQL
        run: sqlfluff lint dbt/models
