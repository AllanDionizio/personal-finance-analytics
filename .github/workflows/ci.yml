name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        run: pytest -q

  # One job from the workbooks to the dashboard: each step needs the
  # warehouse file the previous ones built.
  pipeline:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
      SEND_ANONYMOUS_USAGE_STATS: "no"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate synthetic workbooks and load raw.*
        run: make data

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (seeds, models, unit and data tests)
        working-directory: dbt
        run: dbt build

      - name: Household context report (smoke test on the synthetic marts)
        run: python -m reports.household_context --db data/warehouse.duckdb --out /tmp/context.md

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness

      - name: dbt docs generate (plus a self-contained static page)
        working-directory: dbt
        run: dbt docs generate --static

      - name: Lint SQL
        run: sqlfluff lint dbt/models

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboards/package-lock.json

      - name: Install Evidence
        working-directory: dashboards
        run: npm ci

      - name: Extract the marts for Evidence
        working-directory: dashboards
        run: npm run sources

      - name: Build the dashboard (strict, fails on query or component errors)
        working-directory: dashboards
        run: npm run build:strict

      # Only main is published: the site is exactly what this job just tested
      - name: Assemble the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/dbt-docs
          cp -r dashboards/build/. site/
          cp dbt/target/static_index.html site/dbt-docs/index.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pipeline
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
