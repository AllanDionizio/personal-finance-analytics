repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Runs from the project's venv: the dbt templater needs dbt, the
  # packages (make deps) and the warehouse file to compile the models.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: env DUCKDB_PATH=data/warehouse.duckdb sqlfluff lint
        language: system
        files: ^dbt/models/.*\.sql$
        # One process: parallel batches would fight over the DuckDB file lock
        require_serial: true
