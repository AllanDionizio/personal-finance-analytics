# Dark first, with the switcher for anyone who prefers light. Surfaces follow
# the "Product" direction: cards (base-100, also the chart background) on a
# separate ground color, set in components/brand.css.
appearance:
  default: dark
  switcher: true

theme:
  # Indigo first, checked for color-vision deficiency as an ordered set of
  # six (no chart has more series); the dark steps are tuned for the dark
  # card, not an automatic flip. Benchmarks (IPCA, invested capital) are not
  # in the palette: the pages paint them gray, #7b8491 light / #5f6873 dark.
  colorPalettes:
    default:
      light: ["#5650d6", "#e07a2e", "#0f9a8c", "#b88f00", "#3d8fd6", "#d64f7c"]
      dark: ["#8a85f0", "#d9752a", "#14a393", "#b48c10", "#3f8ade", "#d85c88"]
  colorScales:
    default:
      light: ["#e3e2fc", "#2e2896"]
      dark: ["#2e2896", "#d9d7fb"]
  colors:
    # The first chart color, which passes 4.5:1 as link text on the cards
    # and the ground in both modes
    primary:
      light: "#5650d6"
      dark: "#8a85f0"
    base-100:
      light: "#ffffff"
      dark: "#11151b"
    base-200:
      light: "#f3f5f7"
      dark: "#1a2029"
    base-300:
      light: "#e3e7ec"
      dark: "#262d36"
    base-heading:
      light: "#111827"
      dark: "#f3f4f6"
    base-content:
      light: "#1f2937"
      dark: "#dfe3e8"
    base-content-muted:
      light: "#4b5563"
      dark: "#9aa4af"
    positive:
      light: "#0a6b2e"
      dark: "#3fb950"
    negative:
      light: "#b42318"
      dark: "#f07178"

# Served from GitHub Pages under the repository name; links in the pages
# get this prefix at build time, so they stay written as "/portfolio"
deployment:
  basePath: /personal-finance-analytics

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
