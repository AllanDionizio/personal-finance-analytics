name: personal_finance
version: "0.1.0"
config-version: 2
profile: personal_finance

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Liquid reserve target, in months of fixed spending (fct_net_worth)
  reserve_min_months: 6
  reserve_max_months: 12

models:
  personal_finance:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  personal_finance:
    +schema: seeds
