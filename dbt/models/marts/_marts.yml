version: 2

models:
  - name: dim_date
    description: Calendar, one row per day from 2020-01-01 to 2030-12-31.
    columns:
      - name: date_day
        description: The day.
        data_tests:
          - unique
          - not_null
      - name: year
        description: Calendar year.
      - name: quarter
        description: Calendar quarter, 1 to 4.
      - name: month
        description: Calendar month, 1 to 12.
      - name: month_name
        description: "Month name in English (`'January'`)."
      - name: first_day_of_month
        description: "Joins to the facts' budget_month."
      - name: last_day_of_month
        description: "Last day of the day's month."
      - name: day_of_week
        description: ISO weekday, Monday = 1.
      - name: day_name
        description: "Weekday name in English (`'Monday'`)."
      - name: is_weekend
        description: True on Saturday and Sunday.

  - name: dim_category
    description: >
      One row per category and type, with the 'Unknown' member (category_key = 'unknown')
      for categories in no list.
    columns:
      - name: category_key
        description: '{{ doc("category_key") }}'
        data_tests:
          - unique
          - not_null
      - name: category_type
        description: '{{ doc("category_type") }}'
      - name: category
        description: As typed in Portuguese.
      - name: macro_category
        description: "'Fixed', 'Variable', 'Not applicable', NULL for income, 'Unknown'."
      - name: is_legacy
        description: '{{ doc("is_legacy") }}'
      - name: income_group
        description: >
          Source of an income category ('Salary', 'Variable pay', 'Benefits', 'Business',
          'Dividends', 'Other', 'Asset sales'), from seed income_groups; 'Other' when the seed
          doesn't list it. NULL for expense categories.
        data_tests:
          - not_null:
              config:
                where: "category_type = 'income'"
      - name: is_operating
        description: >
          For income categories, false when the money comes from selling an asset rather than
          earning it ('Asset sales'); such credits stay out of income. NULL for expenses.
        data_tests:
          - not_null:
              config:
                where: "category_type = 'income'"

  - name: dim_owner
    description: "Owners of credits, from the amount cell's color."
    columns:
      - name: owner_key
        description: '{{ doc("owner_key") }}'
        data_tests:
          - unique
          - not_null
      - name: owner
        description: '{{ doc("owner") }}'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Person A
                  - Person B
                  - Other
      - name: display_name
        description: '{{ doc("display_name") }}'
        data_tests:
          - not_null
      - name: source_color
        description: "Cell color in the workbooks; NULL for 'Other'."

  - name: dim_payment_method
    description: Payment methods of debits, from the cell colors.
    columns:
      - name: payment_method_key
        description: '{{ doc("payment_method_key") }}'
        data_tests:
          - unique
          - not_null
      - name: payment_method
        description: '{{ doc("payment_method") }}'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Card A
                  - Card B
                  - Card C
                  - Other
      - name: display_name
        description: '{{ doc("display_name") }}'
        data_tests:
          - not_null
      - name: method_type
        description: '{{ doc("method_type") }}'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - other
      - name: source_color
        description: '{{ doc("source_color") }}'

  - name: fct_transactions
    description: One row per transaction (credit or debit).
    columns:
      - name: transaction_id
        description: '{{ doc("transaction_id") }}'
        data_tests:
          - unique
          - not_null
      - name: transaction_date
        description: '{{ doc("transaction_date") }}'
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_date')"
                field: date_day
      - name: budget_month
        description: First day of the month the transaction is budgeted in.
        data_tests:
          - not_null
          - is_first_day_of_month
          - relationships:
              arguments:
                to: "ref('dim_date')"
                field: date_day
      - name: side
        description: '{{ doc("side") }}'
      - name: description
        description: '{{ doc("description") }}'
      - name: category_key
        description: '{{ doc("category_key") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "ref('dim_category')"
                field: category_key
      - name: owner_key
        description: Credits only; NULL for debits.
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_owner')"
                field: owner_key
      - name: payment_method_key
        description: Debits only; NULL for credits.
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_payment_method')"
                field: payment_method_key
      - name: purchase_id
        description: The installment purchase this row belongs to; NULL if not an installment.
        data_tests:
          - relationships:
              arguments:
                to: "ref('int_installment_purchases')"
                field: purchase_id
      - name: amount
        description: >
          Amount as typed; `side` says the direction. Credits are never negative. A negative
          debit is a refund or discount (an estorno, a discount for paying installments early)
          and nets against its category's spending; card adjustments are negative too.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: side = 'credit'
      - name: effective_amount
        description: amount if is_effective, else 0.
      - name: signed_effective_amount
        description: effective_amount, positive for credits and negative for debits.
      - name: is_settled
        description: '{{ doc("is_settled") }}'
      - name: is_effective
        description: '{{ doc("is_effective") }}'
      - name: is_dividend
        description: '{{ doc("is_dividend") }}'
      - name: is_investment_contribution
        description: '{{ doc("is_investment_contribution") }}'
      - name: is_card_adjustment
        description: '{{ doc("is_card_adjustment") }}'
      - name: is_installment
        description: '{{ doc("is_installment") }}'
      - name: installment_number
        description: '{{ doc("installment_number") }}'
      - name: installment_count
        description: '{{ doc("installment_count") }}'
      - name: source_file
        description: '{{ doc("source_file") }}'
      - name: source_sheet
        description: '{{ doc("source_sheet") }}'
      - name: source_row
        description: '{{ doc("source_row") }}'
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(side = 'credit') = (owner_key is not null)"
          config:
            description: "Credits have an owner and debits don't."
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(side = 'debit') = (payment_method_key is not null)"
          config:
            description: "Debits have a payment method and credits don't."
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: "ref('stg_transactions')"

  - name: fct_installments
    description: >
      One row per installment of every purchase, recorded in the workbooks or not. The sum
      of outstanding_amount is what is still owed.
    columns:
      - name: installment_id
        description: '{{ doc("installment_id") }}'
        data_tests:
          - unique
          - not_null
      - name: purchase_id
        description: '{{ doc("purchase_id") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "ref('int_installment_purchases')"
                field: purchase_id
      - name: installment_number
        description: '{{ doc("installment_number") }}'
      - name: installment_count
        description: '{{ doc("installment_count") }}'
      - name: budget_month
        description: '{{ doc("budget_month") }}'
        data_tests:
          - not_null
          - is_first_day_of_month
          - relationships:
              arguments:
                to: "ref('dim_date')"
                field: date_day
      - name: description
        description: '{{ doc("description") }}'
      - name: category_key
        description: '{{ doc("category_key") }}'
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_category')"
                field: category_key
      - name: payment_method_key
        description: '{{ doc("payment_method_key") }}'
        data_tests:
          - relationships:
              arguments:
                to: "ref('dim_payment_method')"
                field: payment_method_key
      - name: transaction_id
        description: The workbook row of this installment; NULL if it falls outside the workbooks.
        data_tests:
          - unique
          - relationships:
              arguments:
                to: "ref('fct_transactions')"
                field: transaction_id
      - name: amount
        description: '{{ doc("amount") }}'
      - name: outstanding_amount
        description: amount if not settled, else 0.
      - name: is_recorded
        description: True if the installment is in the workbooks.
      - name: is_settled
        description: >
          True before the as-of month (the newest month with a settled transaction, capped at
          the current month): past
          installments are always paid. From then on, the sheet's status for a recorded installment,
          and false for one past the newest workbook.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - purchase_id
              - installment_number
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: installment_count
            column_B: installment_number
            or_equal: true

  - name: fct_monthly_cashflow
    description: >
      One row per closed budget month (every month before the as-of month, the newest one with
      a settled transaction, capped at the current month): income, spending and savings,
      defined once for the dashboard.
    columns:
      - name: budget_month
        description: '{{ doc("budget_month") }}'
        data_tests:
          - unique
          - not_null
          - is_first_day_of_month
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: month
      - name: income
        description: >
          Operating income: settled credits in operating categories (dim_category.is_operating).
          Dividends are included.
        data_tests:
          - not_null
      - name: non_operating_income
        description: >
          Settled credits that are not earned, such as money from selling an asset. Real cash in,
          but outside income and the savings rate.
        data_tests:
          - not_null
      - name: dividends
        description: The part of income from real-estate fund dividends (passive income).
        data_tests:
          - not_null
      - name: spending
        description: >
          Settled debits, investment contributions excluded (effective_amount of debits). Card
          adjustments are negative, so they lower it.
        data_tests:
          - not_null
      - name: fixed_spending
        description: The part of spending in categories whose macro-category is Fixed.
      - name: variable_spending
        description: The part of spending in categories whose macro-category is Variable.
      - name: unclassified_spending
        description: >
          The part of spending in categories with neither macro-category (Unknown or blank);
          0 when every category is classified.
      - name: invested
        description: >
          Debits into investments, whatever their status (the sheets leave them at 'Não'): the
          money left out of spending. Includes reinvested redemptions where the workbooks book
          them (see new_money).
      - name: savings
        description: income - spending, i.e. what was invested plus what stayed in the account.
      - name: new_money
        description: >
          What the household added to its wealth (var new_money_source): invested, when every
          investment row is new money; savings plus non_operating_income, when the investment
          rows also book money reinvested from redemptions, minus dividends (the portfolio
          earned them).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "savings = income - spending"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fixed_spending + variable_spending + unclassified_spending = spending"
          config:
            description: Every unit of spending lands in exactly one macro-category column.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dividends <= income"
          config:
            description: Dividends are part of operating income.

  - name: fct_inflation_monthly
    description: >
      One row per month of Brazil's official consumer inflation (IPCA, seed ipca_monthly), with
      the price index and the 12-month and year-to-date rates compounded from the monthly ones.
    columns:
      - name: month
        description: First day of the month the inflation refers to.
        data_tests:
          - unique
          - not_null
          - is_first_day_of_month
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: month
      - name: ipca_pct
        description: Monthly change in percent, as published (0.82 means 0.82%).
      - name: ipca_rate
        description: ipca_pct as a fraction (0.0082).
      - name: price_index
        description: Price level, 100 at the month before the series starts.
      - name: ipca_12m
        description: Inflation compounded over the 12 months up to this one; NULL in the first 11.
      - name: ipca_ytd
        description: Inflation compounded from January up to this month.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(ipca_ytd - ipca_12m) < 1e-9"
          config:
            where: "month(month) = 12 and ipca_12m is not null"
            description: In December the year to date and the last 12 months are the same months.

  - name: fct_net_worth
    description: >
      One row per portfolio snapshot: value, external flows since the previous snapshot, the
      return (modified Dietz, dividends included) and inflation over the same periods, chained
      over 12 months and the year to date, and the liquid reserve against its target band.
    columns:
      - name: reference_date
        description: '{{ doc("reference_date") }}'
        data_tests:
          - unique
          - not_null
      - name: total_value
        description: Sum of gross_value of every holding in the snapshot.
        data_tests:
          - not_null
      - name: liquid_reserve
        description: >
          Cash balance plus fixed income with no maturity date (daily liquidity): the money
          available at once for an emergency.
        data_tests:
          - not_null
      - name: contributions
        description: >
          New money that came in after the previous snapshot, up to this one: the investment
          contributions, whatever their status, or the closed months' new_money when var
          new_money_source is 'savings' (negative when the period spent more than it earned).
          NULL for the first snapshot, and with 'savings' for a period that reaches a month
          not closed yet.
      - name: dividends
        description: >
          Settled dividends paid in the same window, counted as return. NULL like
          contributions.
      - name: period_gain
        description: >
          total_value - previous total_value - contributions, plus the dividends when they are
          paid outside the portfolio (new_money_source 'contributions').
      - name: period_return
        description: >
          Modified Dietz return of the period: period_gain over the previous value plus half the
          contributions. Understated when money left the portfolio without being recorded.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -0.5
                max_value: 0.5
      - name: period_inflation
        description: >
          IPCA compounded over the months after the previous snapshot's month, up to this
          snapshot's month; NULL while one of them isn't published.
      - name: return_12m
        description: >
          period_return compounded over the last 12 periods; NULL without 12 periods whose
          inflation is known.
      - name: inflation_12m
        description: period_inflation compounded over the same 12 periods.
      - name: real_return_12m
        description: >
          (1 + return_12m) / (1 + inflation_12m) - 1. Above 0 means the portfolio beat
          inflation.
      - name: return_ytd
        description: period_return compounded over the periods ending this year.
      - name: inflation_ytd
        description: period_inflation compounded over the same periods.
      - name: real_return_ytd
        description: (1 + return_ytd) / (1 + inflation_ytd) - 1.
      - name: avg_monthly_spending
        description: >
          Average monthly spending over the last 12 closed months up to the snapshot's month
          (a snapshot in the current, open month uses the 12 before it); NULL with fewer.
      - name: avg_monthly_fixed_spending
        description: Average monthly fixed spending over the same 12 months.
      - name: runway_months
        description: >
          total_value / avg_monthly_spending: how many months the portfolio would pay for all
          spending.
      - name: reserve_months
        description: >
          liquid_reserve / avg_monthly_spending: how many months the reserve would pay for all
          spending.
      - name: reserve_status
        description: >
          'Below target', 'Within target' or 'Above target' against the project vars
          reserve_min_months and reserve_max_months (6 and 12 months of spending).
        data_tests:
          - accepted_values:
              arguments:
                values: ["Below target", "Within target", "Above target"]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "liquid_reserve <= total_value"
      - dbt_utils.expression_is_true:
          arguments:
            # new money from savings is negative in a month that spent more than it earned
            expression: >-
              dividends >= 0
              and (contributions >= 0 or '{{ var("new_money_source") }}' = 'savings')
          config:
            where: "contributions is not null"

  - name: fct_portfolio_snapshots
    description: One row per asset per reference date.
    columns:
      - name: snapshot_id
        description: '{{ doc("snapshot_id") }}'
        data_tests:
          - unique
          - not_null
      - name: reference_date
        description: '{{ doc("reference_date") }}'
        data_tests:
          - not_null
      - name: bank
        description: '{{ doc("bank") }}'
      - name: asset
        description: '{{ doc("asset") }}'
      - name: asset_class
        description: '{{ doc("asset_class") }}'
        data_tests:
          - not_null
      - name: gross_value
        description: '{{ doc("gross_value") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: allocation_pct
        description: "Share of the snapshot's total, 0 to 1; NULL in snapshots that didn't\
          \ report it."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: maturity_date
        description: '{{ doc("maturity_date") }}'
      - name: mom
        description: '{{ doc("mom") }}'
      - name: yoy
        description: '{{ doc("yoy") }}'
      - name: net_value_at_maturity
        description: '{{ doc("net_value_at_maturity") }}'
      - name: return_to_date
        description: '{{ doc("return_to_date") }}'
      - name: return_at_maturity
        description: '{{ doc("return_at_maturity") }}'

  - name: fct_goals
    description: >
      One row: where the household stands against its goals at the newest portfolio
      snapshot. Financial independence (the target, the monthly new money it needs by the
      target month, and when the current pace gets there), the new money goal of the current
      month, and the liquid reserve goal. Amounts are in today's money; the goal settings are
      project vars (fi_*, new_money_goal_*, reserve_min_months).
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 1
    columns:
      - name: as_of_date
        description: The newest snapshot's reference date.
        data_tests:
          - not_null
      - name: projection_from
        description: The month the projections start from, the newest snapshot's.
      - name: wealth
        description: The portfolio's value at the newest snapshot.
      - name: fi_monthly_spending
        description: >
          The monthly cost of living independence has to cover: var fi_monthly_spending, or the
          last 12 closed months' average spending.
      - name: fi_withdrawal_rate
        description: Yearly share of the portfolio that can be spent for good (var).
      - name: fi_real_return
        description: Yearly return above inflation the projections assume (var).
      - name: monthly_return
        description: fi_real_return as a monthly rate.
      - name: fi_target_value
        description: fi_monthly_spending * 12 / fi_withdrawal_rate.
        data_tests:
          - not_null
      - name: fi_progress
        description: wealth / fi_target_value.
      - name: fi_target_month
        description: The month independence should be reached (var fi_target_month).
      - name: months_to_target
        description: Months from projection_from to fi_target_month.
      - name: required_monthly_new_money
        description: >
          New money a month, in today's money, that takes wealth to fi_target_value by
          fi_target_month; 0 when the return alone gets there, NULL once the month has passed.
      - name: current_monthly_new_money
        description: Average new_money of the last 12 closed months.
      - name: projected_fi_month
        description: >
          When the portfolio reaches fi_target_value at the current pace; NULL when it doesn't
          within a century.
      - name: new_money_goal
        description: >
          The current month's new money goal: none before new_money_goal_from, then
          new_money_goal_start raised by new_money_goal_step every 12 months, never above
          required_monthly_new_money.
      - name: reserve
        description: The liquid reserve at the newest snapshot (fct_net_worth.liquid_reserve).
      - name: reserve_target
        description: reserve_min_months times the average monthly spending.
        data_tests:
          - not_null
      - name: reserve_progress
        description: reserve / reserve_target.

  - name: fct_goal_tracking
    description: >
      One row per month, from the first portfolio snapshot to the independence target month:
      the portfolio in today's money, new money against its goal, and two projections from
      the newest snapshot, at the pace independence needs and at the current pace.
    columns:
      - name: month
        description: First day of the month.
        data_tests:
          - unique
          - not_null
      - name: wealth_today_money
        description: >
          The month's last snapshot value at today's prices (price index of today over the
          month's); NULL for a month without a snapshot.
      - name: new_money
        description: fct_monthly_cashflow.new_money; NULL outside the closed months.
      - name: new_money_goal
        description: The month's new money goal (see fct_goals.new_money_goal).
      - name: fi_target_value
        description: The independence target, the same every month.
      - name: required_path
        description: >
          From the newest snapshot's month on, the value the portfolio reaches with
          required_monthly_new_money a month; it ends on fi_target_value.
      - name: current_pace_path
        description: The same projection with current_monthly_new_money.
