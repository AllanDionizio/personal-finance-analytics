version: 2

unit_tests:
  - name: test_installments_settle_before_the_as_of_month
    description: >
      The as-of month is October 2026. p1 (3x from December 2020) is all
      before it: the unrecorded first installment and a leftover 'Não' both
      count as paid. p2 (4x from October 2026) keeps the sheet's status from
      October on, and its fourth installment, past the newest workbook, is
      outstanding.
    model: fct_installments
    given:
      - input: ref('int_installment_purchases')
        rows:
          - {purchase_id: "p1", description: "Loja", category_key: "k", payment_method: "Card A", installment_count: 3, installment_amount: 50, first_budget_month: "2020-12-01"}
          - {purchase_id: "p2", description: "Curso", category_key: "k", payment_method: "Card B", installment_count: 4, installment_amount: 80, first_budget_month: "2026-10-01"}
      - input: ref('int_installment_transactions')
        rows:
          - {transaction_id: "t12", purchase_id: "p1", installment_number: 2, is_settled: false}
          - {transaction_id: "t13", purchase_id: "p1", installment_number: 3, is_settled: true}
          - {transaction_id: "t21", purchase_id: "p2", installment_number: 1, is_settled: true}
          - {transaction_id: "t22", purchase_id: "p2", installment_number: 2, is_settled: false}
          - {transaction_id: "t23", purchase_id: "p2", installment_number: 3, is_settled: false}
      - input: ref('stg_transactions')
        rows:
          - {budget_month: "2026-10-01", is_settled: true}
          - {budget_month: "2026-12-01", is_settled: false}
    expect:
      rows:
        - {purchase_id: "p1", installment_number: 1, budget_month: "2020-12-01", is_recorded: false, is_settled: true, outstanding_amount: 0}
        - {purchase_id: "p1", installment_number: 2, budget_month: "2021-01-01", is_recorded: true, is_settled: true, outstanding_amount: 0}
        - {purchase_id: "p1", installment_number: 3, budget_month: "2021-02-01", is_recorded: true, is_settled: true, outstanding_amount: 0}
        - {purchase_id: "p2", installment_number: 1, budget_month: "2026-10-01", is_recorded: true, is_settled: true, outstanding_amount: 0}
        - {purchase_id: "p2", installment_number: 2, budget_month: "2026-11-01", is_recorded: true, is_settled: false, outstanding_amount: 80}
        - {purchase_id: "p2", installment_number: 3, budget_month: "2026-12-01", is_recorded: true, is_settled: false, outstanding_amount: 80}
        - {purchase_id: "p2", installment_number: 4, budget_month: "2027-01-01", is_recorded: false, is_settled: false, outstanding_amount: 80}

  - name: test_monthly_cashflow_counts_closed_months_only
    description: >
      The as-of month is March 2026, so only January and February are closed. The investment
      contribution is not spending, the unpaid March bill is left out with its month, and the
      asset sale is cash in but not income.
    model: fct_monthly_cashflow
    given:
      - input: ref('stg_transactions')
        rows:
          - {budget_month: "2026-03-01", is_settled: true}
      - input: ref('fct_transactions')
        rows:
          - {budget_month: "2026-01-01", side: "credit", category_key: "inc", amount: 1000, effective_amount: 1000, is_settled: true, is_investment_contribution: false, is_dividend: false}
          - {budget_month: "2026-01-01", side: "credit", category_key: "div", amount: 40, effective_amount: 40, is_settled: true, is_investment_contribution: false, is_dividend: true}
          - {budget_month: "2026-02-01", side: "credit", category_key: "sale", amount: 5000, effective_amount: 5000, is_settled: true, is_investment_contribution: false, is_dividend: false}
          - {budget_month: "2026-01-01", side: "debit", category_key: "fix", amount: 300, effective_amount: 300, is_settled: true, is_investment_contribution: false}
          - {budget_month: "2026-01-01", side: "debit", category_key: "inv", amount: 200, effective_amount: 0, is_settled: true, is_investment_contribution: true}
          - {budget_month: "2026-02-01", side: "debit", category_key: "var", amount: 50, effective_amount: 50, is_settled: true, is_investment_contribution: false}
          - {budget_month: "2026-02-01", side: "debit", category_key: "unknown", amount: 10, effective_amount: 10, is_settled: true, is_investment_contribution: false}
          - {budget_month: "2026-03-01", side: "debit", category_key: "fix", amount: 300, effective_amount: 0, is_settled: false, is_investment_contribution: false}
      - input: ref('dim_category')
        rows:
          - {category_key: "inc", macro_category: null, is_operating: true}
          - {category_key: "div", macro_category: null, is_operating: true}
          - {category_key: "sale", macro_category: null, is_operating: false}
          - {category_key: "fix", macro_category: "Fixed"}
          - {category_key: "var", macro_category: "Variable"}
          - {category_key: "inv", macro_category: "Not applicable"}
          - {category_key: "unknown", macro_category: "Unknown"}
    expect:
      rows:
        - {budget_month: "2026-01-01", income: 1040, non_operating_income: 0, dividends: 40, spending: 300, fixed_spending: 300, variable_spending: 0, unclassified_spending: 0, invested: 200, savings: 740}
        - {budget_month: "2026-02-01", income: 0, non_operating_income: 5000, dividends: 0, spending: 60, fixed_spending: 0, variable_spending: 50, unclassified_spending: 10, invested: 0, savings: -60}

  - name: test_net_worth_returns_flows_and_reserve
    description: >
      Three snapshots. The February period has a 1,000 contribution and a 50 dividend: gain
      10,650 - 9,500 - 1,000 + 50 = 200 over 9,500 + 500 = 10,000, a 2% modified Dietz return.
      March has no flows: 213 over 10,650, 2% again; the contribution dated after the March
      snapshot belongs to the next period. The reserve (cash plus fixed income with no
      maturity) needs 12 closed months of spending: February has 11, March has 12, and 1,200
      of reserve is 12 months of fixed spending, the top of the band.
    model: fct_net_worth
    given:
      - input: ref('fct_portfolio_snapshots')
        rows:
          - {reference_date: "2026-01-20", asset_class: "Cash", gross_value: 500, maturity_date: null}
          - {reference_date: "2026-01-20", asset_class: "Fixed income", gross_value: 9000, maturity_date: "2030-01-01"}
          - {reference_date: "2026-02-20", asset_class: "Cash", gross_value: 1150, maturity_date: null}
          - {reference_date: "2026-02-20", asset_class: "Fixed income", gross_value: 9500, maturity_date: "2030-01-01"}
          - {reference_date: "2026-03-20", asset_class: "Cash", gross_value: 1000, maturity_date: null}
          - {reference_date: "2026-03-20", asset_class: "Fixed income", gross_value: 200, maturity_date: null}
          - {reference_date: "2026-03-20", asset_class: "Fixed income", gross_value: 9663, maturity_date: "2030-01-01"}
      - input: ref('fct_transactions')
        rows:
          - {transaction_date: "2026-02-10", budget_month: "2026-02-01", amount: 1000, is_settled: true, is_investment_contribution: true, is_dividend: false}
          - {transaction_date: "2026-02-15", budget_month: "2026-02-01", amount: 50, is_settled: true, is_investment_contribution: false, is_dividend: true}
          - {transaction_date: "2026-02-18", budget_month: "2026-02-01", amount: 300, is_settled: false, is_investment_contribution: true, is_dividend: false}
          - {transaction_date: "2026-03-25", budget_month: "2026-03-01", amount: 700, is_settled: true, is_investment_contribution: true, is_dividend: false}
      - input: ref('fct_inflation_monthly')
        rows:
          - {month: "2026-01-01", ipca_rate: 0.004}
          - {month: "2026-02-01", ipca_rate: 0.005}
          - {month: "2026-03-01", ipca_rate: 0.003}
      - input: ref('fct_monthly_cashflow')
        rows:
          - {budget_month: "2025-04-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-05-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-06-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-07-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-08-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-09-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-10-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-11-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2025-12-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2026-01-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2026-02-01", spending: 200, fixed_spending: 100}
          - {budget_month: "2026-03-01", spending: 200, fixed_spending: 100}
    expect:
      rows:
        - {reference_date: "2026-01-20", total_value: 9500, liquid_reserve: 500, contributions: null, dividends: null, period_return: null, reserve_months: null, runway_months: null, reserve_status: null}
        - {reference_date: "2026-02-20", total_value: 10650, liquid_reserve: 1150, contributions: 1000, dividends: 50, period_return: 0.02, reserve_months: null, runway_months: null, reserve_status: null}
        - {reference_date: "2026-03-20", total_value: 10863, liquid_reserve: 1200, contributions: 0, dividends: 0, period_return: 0.02, reserve_months: 12, runway_months: 54.315, reserve_status: "Within target"}
