version: 2

unit_tests:
  - name: test_installments_outside_the_workbooks
    description: >
      A 4x purchase whose workbooks only hold installments 2 and 3: the first
      is laid out as settled (before the first recorded one), the last as
      outstanding (after the last recorded one).
    model: fct_installments
    given:
      - input: ref('int_installment_purchases')
        rows:
          - {purchase_id: "p1", description: "Loja", category_key: "k", payment_method: "Card A", installment_count: 4, installment_amount: 50, first_budget_month: "2020-12-01", first_recorded_installment: 2, last_recorded_installment: 3}
      - input: ref('int_installment_transactions')
        rows:
          - {transaction_id: "t2", purchase_id: "p1", installment_number: 2, is_settled: true}
          - {transaction_id: "t3", purchase_id: "p1", installment_number: 3, is_settled: false}
    expect:
      rows:
        - {installment_number: 1, budget_month: "2020-12-01", transaction_id: null, is_recorded: false, is_settled: true, outstanding_amount: 0}
        - {installment_number: 2, budget_month: "2021-01-01", transaction_id: "t2", is_recorded: true, is_settled: true, outstanding_amount: 0}
        - {installment_number: 3, budget_month: "2021-02-01", transaction_id: "t3", is_recorded: true, is_settled: false, outstanding_amount: 50}
        - {installment_number: 4, budget_month: "2021-03-01", transaction_id: null, is_recorded: false, is_settled: false, outstanding_amount: 50}
