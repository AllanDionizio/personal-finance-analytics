version: 2

seeds:
  - name: color_mapping
    description: >
      Cell background colors that carry meaning in the workbooks. A credit's
      amount color is its owner; a debit's color is the card it was paid with.
      Any other color (white, black, no fill, a manual highlight) maps to
      'Other' in staging.
    config:
      column_types:
        hex: varchar
        dimension: varchar
        value: varchar
    columns:
      - name: hex
        description: 6-char uppercase hex, no alpha.
        data_tests:
          - unique
          - not_null
      - name: dimension
        description: Which column the color feeds.
        data_tests:
          - accepted_values:
              arguments:
                values: ["owner", "payment_method"]
      - name: value
        description: Owner or payment method the color stands for.
        data_tests:
          - not_null

  - name: legacy_categories
    description: >
      Categories typed in old workbooks that are no longer in the canonical
      list (the 2026 "Configurações" sheet), with the macro-category they
      would have had.
    columns:
      - name: category_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["income", "expense"]
      - name: category
        data_tests:
          - not_null
      - name: macro_category
        description: As typed in the source ('Fixo', 'Variável', 'n/a').

  - name: category_renames
    description: >
      Categories typed in old workbooks under a name the canonical list later
      changed, mapped to the current name so their history joins it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["category_type", "category"]
    columns:
      - name: category_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["income", "expense"]
      - name: category
        description: The old name, as typed.
        data_tests:
          - not_null
      - name: renamed_to
        description: The canonical name it is read as.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_categories')
                field: category

  - name: asset_aliases
    description: >
      Asset names that are really a note typed over the name (e.g. a rate
      change), mapped back to the asset, so its history stays one series.
    columns:
      - name: bank
        description: Canonical bank name, as in stg_portfolio_snapshots.
      - name: raw_asset
        description: Name as typed in the snapshot.
        data_tests:
          - not_null
      - name: asset
        description: Asset the row belongs to.
        data_tests:
          - not_null
      - name: reason
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["bank", "raw_asset"]

  - name: income_groups
    description: >
      Groups each income category into the source it comes from, and marks
      which ones are operating income. Non-operating credits (money from
      selling an asset) are real cash in, but not income, so they stay out of
      income and the savings rate.
    config:
      column_types:
        category: varchar
        income_group: varchar
        is_operating: boolean
    columns:
      - name: category
        description: Income category as typed in the workbooks.
        data_tests:
          - unique
          - not_null
      - name: income_group
        description: Source of the income, as shown on the dashboard.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Salary", "Variable pay", "Benefits", "Business", "Dividends", "Other", "Asset sales"]
      - name: is_operating
        description: False for money that comes from selling an asset rather than earning it.
        data_tests:
          - not_null

  - name: ipca_monthly
    description: >
      Brazil's official consumer inflation (IPCA), monthly, from the Central
      Bank's SGS series 433:
      https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?formato=json.
      Public data, refreshed by hand when a new month is published.
    config:
      column_types:
        month: date
        ipca_pct: decimal(6,2)
    columns:
      - name: month
        description: First day of the month the inflation refers to.
        data_tests:
          - unique
          - not_null
      - name: ipca_pct
        description: Monthly change in percent (0.82 means 0.82%).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
