[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-finance-analytics"
version = "0.1.0"
description = "End-to-end analytics engineering project on household finance data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "openpyxl>=3.1",
    # Evidence reads the warehouse with its own DuckDB, which opens only 1.x files
    "duckdb>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.1",  # keep in sync with .pre-commit-config.yaml
    "pre-commit>=4.0",
    "mypy>=1.10",
    # dbt and SQL lint, pinned so local runs and CI build the same way
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "sqlfluff==4.4.0",  # keep in sync with .pre-commit-config.yaml
    "sqlfluff-templater-dbt==4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "synthetic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # keep code samples in docs as written

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # bare expressions in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
